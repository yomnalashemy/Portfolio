# Runs as a Node web service (not a static site) so Next.js can serve the
# redirects in next.config.mjs and optimise the project screenshots.
# Set NEXT_PUBLIC_SITE_URL if the site moves to a custom domain; otherwise
# canonical URLs and the sitemap use Render's RENDER_EXTERNAL_URL.
services:
  - type: web
    name: portfolio
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start -- -p $PORT
